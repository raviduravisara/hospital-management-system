name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/HospitalAPI/HospitalAPI.csproj

      - name: Build
        run: dotnet build backend/HospitalAPI/HospitalAPI.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build tests/HospitalAPI.Tests/HospitalAPI.Tests.csproj --configuration Release

      - name: Test
        run: dotnet test tests/HospitalAPI.Tests/HospitalAPI.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
