name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"

jobs:
  dockerize-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/HospitalAPI/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hospital-management-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hospital-management-api:${{ github.sha }}

  redeploy-azure-appservice:
    runs-on: ubuntu-latest
    needs: dockerize-and-push

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Point App Service to latest Docker image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --resource-group hms-rg \
              --name hospital-management-api \
              --docker-custom-image-name docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hospital-management-api:latest

      - name: Restart App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp restart \
              --resource-group hms-rg \
              --name hospital-management-api
