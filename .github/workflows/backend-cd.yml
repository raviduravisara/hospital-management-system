name: Backend CD

on:
  push:
    branches:
      - development
      - fix/backend-cd-webhook
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"

jobs:
  dockerize-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        shell: bash
        run: |
          if [ -z "$DOCKERHUB_USER" ]; then
            echo "::error::DOCKERHUB_USERNAME is empty or not available to this workflow."
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN is empty or not available to this workflow."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/HospitalAPI/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/hospital-management-api:latest
            ${{ env.DOCKERHUB_USER }}/hospital-management-api:${{ github.sha }}

  redeploy-azure-appservice:
    runs-on: ubuntu-latest
    needs: dockerize-and-push

    steps:
      - name: Trigger Azure App Service container redeploy
        run: curl -X POST "${{ secrets.AZURE_WEBAPP_WEBHOOK_URL }}"
        shell: bash